services:
  postgres:
    image: postgres:16-alpine
    container_name: shopcart_db
    environment:
      POSTGRES_DB: shopcart
      POSTGRES_USER: shopcart
      POSTGRES_PASSWORD: shopcart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopcart"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
